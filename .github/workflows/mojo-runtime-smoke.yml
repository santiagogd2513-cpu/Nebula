name: MojoLauncher runtime integration smoke build

on:
  push:
    branches: [ integration/mojo-runtime ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upstream-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Nebula and recursive MojoLauncher submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK required by pinned MojoLauncher
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses

      - name: Build pinned MojoLauncher application
        working-directory: vendor/MojoLauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_mojo:assembleDebug

      - name: Verify upstream APK
        run: |
          test -s vendor/MojoLauncher/app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk || find vendor/MojoLauncher/app_mojo/build/outputs/apk -name '*.apk' -type f -size +0c
