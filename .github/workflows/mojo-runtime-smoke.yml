name: Nebula unified Android build

on:
  push:
    branches: [ integration/mojo-runtime ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Nebula and pinned MojoLauncher submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build components
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Integrate Nebula into the Mojo application
        run: python3 .github/scripts/integrate_nebula.py

      - name: Run Nebula unit tests and compile the single full APK
        run: gradle --no-daemon :app:testDebugUnitTest :app_mojo:assembleFullDebug

      - name: Verify the unified APK
        id: apk
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find vendor/MojoLauncher/app_mojo/build/outputs/apk -path '*/full/debug/*.apk' -type f -size +0c)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload Nebula unified APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-unified-full-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
