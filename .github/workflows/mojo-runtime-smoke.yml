name: Nebula unified Android build

on:
  push:
    branches: [ integration/mojo-runtime ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Nebula and pinned MojoLauncher submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build components
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Static checks for integration tooling
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/integrate_nebula.py
          git diff --check

      - name: Integrate Nebula into the Mojo application
        run: python3 .github/scripts/integrate_nebula.py

      - name: Run Nebula unit tests and compile the single full APK
        run: gradle --no-daemon :app:testDebugUnitTest :app_mojo:assembleFullDebug

      - name: Verify the unified APK and Nebula package identity
        id: apk
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find vendor/MojoLauncher/app_mojo/build/outputs/apk -path '*/full/debug/*.apk' -type f -size +0c)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.nebula.launcher'"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Publish the standalone Nebula APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="0.2.${RUN_NUMBER}"
          TAG="v${VERSION}"
          test -s "${APK_PATH}"
          gh release create "${TAG}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nebula ${VERSION}" \
            --notes "Nebula unified Android APK. Source commit: ${SHA}." \
            --latest

      - name: Keep a direct APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-unified-full-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
