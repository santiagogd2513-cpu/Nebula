name: MojoLauncher runtime integration smoke build

on:
  push:
    branches: [ integration/mojo-runtime ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nebula:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nebula and recursive MojoLauncher submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Nebula Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Nebula unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Nebula debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Nebula APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"

  build-upstream-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Nebula and recursive MojoLauncher submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK required by pinned MojoLauncher
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses

      - name: Build pinned MojoLauncher application
        working-directory: vendor/MojoLauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_mojo:assembleDebug

      - name: Verify full runtime APK
        run: |
          APK=$(find vendor/MojoLauncher/app_mojo/build/outputs/apk -path '*/full/debug/*.apk' -type f -size +0c | head -n 1)
          test -n "$APK"
          echo "MOJO_APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Upload full MojoLauncher runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: mojolauncher-full-debug-apk
          path: ${{ env.MOJO_APK }}
          if-no-files-found: error
          retention-days: 14

  build-unified-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Nebula with pinned MojoLauncher and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install unified runtime SDK components
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile MojoLauncher application from Nebula root
        run: gradle --no-daemon :app_mojo:assembleFullDebug

      - name: Verify unified-engine APK output
        run: |
          APK=$(find vendor/MojoLauncher/app_mojo/build/outputs/apk -path '*/full/debug/*.apk' -type f -size +0c | head -n 1)
          test -n "$APK"
          sha256sum "$APK"
