name: Build and publish Nebula APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nebula-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Calculate unique release version
        id: version
        shell: bash
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest -PnebulaVersionName=${{ steps.version.outputs.name }} -PnebulaVersionCode=${{ steps.version.outputs.code }}
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug -PnebulaVersionName=${{ steps.version.outputs.name }} -PnebulaVersionCode=${{ steps.version.outputs.code }}
      - name: Publish newest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nebula $VERSION" \
            --notes "Automated Android debug build from commit $GITHUB_SHA." \
            --latest
      - name: Keep downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ steps.version.outputs.name }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error