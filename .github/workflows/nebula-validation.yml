name: Nebula library validation

on:
  push:
    branches: [ integration/mojo-runtime ]
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/nebula-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nebula:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Nebula and pinned MojoLauncher source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Nebula Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Nebula unit tests and assemble library
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify Nebula library artifact
        run: test -s app/build/outputs/aar/app-debug.aar

      - name: Upload Nebula library validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-library-debug-aar
          path: app/build/outputs/aar/app-debug.aar
          if-no-files-found: error
          retention-days: 14
