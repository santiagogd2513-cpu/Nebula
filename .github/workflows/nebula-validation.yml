name: Nebula app validation

on:
  push:
    branches: [ integration/mojo-runtime ]
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/nebula-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nebula:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Nebula and pinned MojoLauncher source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Nebula Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Nebula unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Nebula debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Nebula APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Nebula debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: nebula-integration-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
