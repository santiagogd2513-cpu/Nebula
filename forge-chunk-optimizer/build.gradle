plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.nebula'
version = '1.0.0'

base {
    archivesName = 'NebulaChunkOptimizer'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                nebula_chunk_optimizer { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                nebula_chunk_optimizer { source sourceSets.main }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.5'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'Nebula Chunk Optimizer',
            'Specification-Vendor'    : 'Nebula',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : 'Nebula'
        ])
    }
    finalizedBy 'reobfJar'
}
