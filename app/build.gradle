plugins { id 'com.android.application' }

def nebulaVersionCodeValue = providers.gradleProperty('nebulaVersionCode').getOrElse('1')
def nebulaVersionNameValue = providers.gradleProperty('nebulaVersionName').getOrElse('0.1.0-dev')

android {
    namespace 'com.nebula.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nebula.launcher'
        minSdk 26
        targetSdk 35
        versionCode nebulaVersionCodeValue.toInteger()
        versionName nebulaVersionNameValue
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}