plugins { id 'com.android.application' }

android {
    namespace 'com.nebula.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nebula.launcher'
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('nebulaVersionCode') ?: '1').toInteger()
        versionName project.findProperty('nebulaVersionName') ?: '0.1.0-dev'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}